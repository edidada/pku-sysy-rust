name: PKU SysY Lv3 expressions
on:
  push:
    branches: [edidada/lv3-expr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo test --locked && cargo build --release --locked
      - run: python3 scripts/check_cli.py
      - run: sudo apt-get update && sudo apt-get install -y binutils-riscv64-linux-gnu qemu-user
      - run: bash scripts/verify-rv32.sh | tee rv32-runtime.log
      - run: bash scripts/verify-expressions.sh | tee expressions-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lv3-runtime
          path: |
            evidence/
            *-runtime.log
  official:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Official Koopa and RISC-V Lv1 and Lv3 suites
        run: |
          set -euo pipefail
          for level in lv1 lv3; do
            for mode in koopa riscv; do
              docker run --rm -v "$PWD:/root/compiler" maxxing/compiler-dev autotest -"$mode" -s "$level" /root/compiler 2>&1 | tee "lv3-$mode-$level.txt"
            done
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          for level in ['lv1','lv3']:
              for mode in ['koopa','riscv']:
                  text=re.sub(r'\x1b\[[0-9;]*m','',Path(f'lv3-{mode}-{level}.txt').read_text())
                  summary=re.findall(r'PASSED \((\d+)/(\d+)\)',text)
                  assert summary and int(summary[-1][0])>0 and summary[-1][0]==summary[-1][1],text
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lv3-official
          path: lv3-*.txt
