name: PKU SysY Lv8 functions and globals (in development)
on:
  push:
    branches: [edidada/lv8-func-n-global]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: Frontend milestone and existing unit tests (not Lv8 acceptance)
        run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 scripts/check_cli.py
